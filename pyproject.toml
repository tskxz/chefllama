[project]
name = "chefllama"
version = "0.1.0"
description = "Personal Chef AI Agent com LangChain, Ollama e Tavily Search"
readme = "README.md"
authors = [
    { name = "Tanjil", email = "tanjilkh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "python-dotenv>=1.0.1",
    "tavily-python>=0.7.27",
]

[project.scripts]
chefllama = "chefllama:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
